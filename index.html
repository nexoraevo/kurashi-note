y:"小さじ2",stock:!0},{name:"オリーブ油",qty:"大さじ1",stock:!0}],steps:["玉ねぎとにんじんをみじん切りにする。","油でひき肉と野菜を炒め、トマト缶・調味料を入れる。","10分煮詰め、その間にスパゲッティをゆでる。","ゆでたパスタにソースをかける。"],note:"にんじんは細かく刻むとソースに隠れます。多めに作って冷凍も。"},{id:"m-aibiki-nikuzume",kind:"main",name:"ピーマンの肉詰め",protein:"合いびき",genre:"洋",minutes:30,price:800,proteinGrams:350,ingredients:[{name:"合いびき肉",qty:"350g",price:530},{name:"ピーマン",qty:"6個",price:225},{name:"玉ねぎ",qty:"1/4個",price:15},{name:"卵",qty:"1個",price:30},{name:"パン粉",qty:"大さじ4",stock:!0},{name:"片栗粉",qty:"大さじ1",stock:!0},{name:"ケチャップ",qty:"大さじ3",stock:!0},{name:"中濃ソース",qty:"大さじ2",stock:!0},{name:"塩・こしょう",qty:"少々",stock:!0},{name:"サラダ油",qty:"小さじ2",stock:!0}],steps:["ピーマンを縦半分に切り、内側に片栗粉をふる。","ひき肉・玉ねぎのみじん切り・卵・パン粉・塩こしょうをこねる。","ピーマンに詰め、肉の面から焼いてふたをし7分蒸し焼きにする。","ケチャップとソースを加えてからめる。"],note:"肉の面をしっかり焼くとはがれにくいです。苦手な子は肉だけでも。"},{id:"m-aibiki-soboro",kind:"main",name:"合いびきの甘辛そぼろ丼",protein:"合いびき",genre:"和",minutes:20,price:840,proteinGrams:400,ingredients:[{name:"合いびき肉",qty:"400g",price:600},{name:"卵",qty:"3個",price:90},{name:"絹さや",qty:"1パック",price:150},{name:"ごはん",qty:"4杯分",stock:!0},{name:"しょうゆ",qty:"大さじ3",stock:!0},{name:"砂糖",qty:"大さじ2",stock:!0},{name:"みりん",qty:"大さじ1",stock:!0},{name:"しょうが（チューブ）",qty:"小さじ1",stock:!0}],steps:["ひき肉にしょうゆ・砂糖・みりん・しょうがを入れ、炒り煮にする。","卵に砂糖少々を混ぜ、いり卵を作る。","絹さやはゆでて細切りにする。","ごはんに3色をのせる。"],note:"絹さやがない日はゆでたほうれん草や枝豆でも。"},{id:"m-aibiki-jaga-soboro",kind:"main",name:"じゃがいものそぼろ煮",protein:"合いびき",genre:"和",minutes:25,price:720,proteinGrams:300,ingredients:[{name:"合いびき肉",qty:"300g",price:450},{name:"じゃがいも",qty:"5個",price:250},{name:"玉ねぎ",qty:"1/2個",price:25},{name:"しょうゆ",qty:"大さじ3",stock:!0},{name:"砂糖",qty:"大さじ2",stock:!0},{name:"みりん",qty:"大さじ2",stock:!0},{name:"顆粒だし",qty:"小さじ1",stock:!0},{name:"片栗粉",qty:"小さじ2",stock:!0}],steps:["じゃがいもは一口大、玉ねぎはくし切りにする。","鍋でひき肉を炒め、野菜を加えて炒める。","水300ml・だし・調味料を入れ、ふたをして15分煮る。","水溶き片栗粉でとろみをつける。"],note:"とろみがあるので、小さい子もじゃがいもをスプーンで食べやすいです。"},{id:"m-aibiki-mabodofu",kind:"main",name:"麻婆豆腐",protein:"合いびき",genre:"中",minutes:20,price:700,proteinGrams:30 s:["レタスは細切り、トマトは角切りにする。","ひき肉を炒め、ケチャップ・ソース・カレー粉で味をつける。","ごはんにレタス・ひき肉・トマト・チーズをのせる。"],note:"火を使うのは肉だけ。大人はタバスコを後からかけて。"},{id:"m-aibiki-bibimbap",kind:"main",name:"合いびきのビビンバ風混ぜごはん",protein:"合いびき",genre:"韓",minutes:20,price:780,proteinGrams:300,ingredients:[{name:"合いびき肉",qty:"300g",price:450},{name:"もやし",qty:"1袋",price:40},{name:"小松菜",qty:"1束",price:150},{name:"にんじん",qty:"1/2本",price:25},{name:"卵",qty:"4個",price:120},{name:"ごはん",qty:"4杯分",stock:!0},{name:"しょうゆ",qty:"大さじ2",stock:!0},{name:"砂糖",qty:"大さじ1",stock:!0},{name:"ごま油",qty:"大さじ2",stock:!0},{name:"鶏がらスープの素",qty:"小さじ1",stock:!0}],steps:["ひき肉をしょうゆ・砂糖で炒め煮にする。","もやし・小松菜・にんじんをレンジで加熱し、水気をしぼる。","ごま油と鶏がらの素で野菜をあえる。","ごはんに肉・ナムル・目玉焼きをのせる。"],note:"大人はコチュジャンを足して。子どもは混ぜて食べるのが楽しいです。"},{id:"m-aibiki-gamja",kind:"main",name:"韓国風ひき肉とじゃがいもの甘辛煮",protein:"合いびき",genre:"韓",minutes:25,price:700,proteinGrams:300,ingredients:[{name:"合いびき肉",qty:"300g",price:450},{name:"じゃがいも",qty:"4個",price:200},{name:"玉ねぎ",qty:"1/2個",price:25},{name:"にんじん",qty:"1/2本",price:25},{name:"しょうゆ",qty:"大さじ3",stock:!0},{name:"砂糖",qty:"大さじ1",stock:!0},{name:"はちみつ",qty:"大さじ1",stock:!0},{name:"ごま油",qty:"大さじ1",stock:!0},{name:"いりごま",qty:"小さじ1",stock:!0}],steps:["じゃがいもとにんじんは小さめの乱切り、玉ねぎはくし切り。","ごま油でひき肉と野菜を炒める。","水200ml・しょうゆ・砂糖・はちみつを入れ15分煮る。","煮汁がからんだらごまをふる。"],note:"はちみつで照りよく甘めに。大人の分はコチュジャンを混ぜても。"},{id:"m-sakana-chanchan",kind:"main",name:"鮭のちゃんちゃん焼き",protein:"魚",genre:"和",minutes:25,price:850,proteinGrams:400,ingredients:[{name:"生鮭",qty:"4切れ",price:600},{name:"キャベツ",qty:"1/4個",price:80},{name:"玉ねぎ",qty:"1/2個",price:25},{name:"にんじん",qty:"1/2本",price:25},{name:"しめじ",qty:"1パック",price:120},{name:"みそ",qty:"大さじ3",stock:!0},{name:"砂糖",qty:"大さじ1",stock:!0},{name:"みりん",qty:"大さじ2",stock:!0},{name:"バター",qty:"10g",stock:!0}],steps:["キャベツはざく切り、玉ねぎ・にんじんは薄切りにする。","みそ・砂糖・みりんを混ぜる。","フライパンに野菜を敷き、鮭をのせてみそだれをかける。","ふたをして10分蒸し焼きにし、バターをのせる。"],note:"鮭の骨は先に抜いておくと、子どもに出しやすいです。"},{id:"m-sakana-sabamiso",kind:"main",name:"さばのみそ煮",protein:"魚",genre:"和",minutes:25,price:660,proteinGrams:400,ingredients:[{name:"さば切り身",qty:"4切れ",price:560},{name:"長ねぎ",qty:"1本",price:100},{name:"しょうが（チューブ）",qty:"小さじ1",stock:!0},{name:"みそ",qty:"大さじ3",stock:!0},{name:"砂糖",qty:"大さじ2",stock:!0},{name:"酒",qty:"大さじ3",stock:!0},{name:"みりん",qty:"大さじ1",stock:!0}],steps:["さばの皮に切り込みを入れ、長ねぎは4cmに切る。","鍋に水150ml・酒・砂糖・みりん・しょうがを煮立てる。","さばとねぎを入れ、落としぶたをして8分煮る。","みそを溶き入れ、煮汁をかけながら5分煮る。"],note:"骨取りさばを使うと、子どもにも安心して出せます。"},{id:"m-sakana-buri-teri",kind:"main",name:"ぶりの照り焼き",protein:"魚",genre:"和",minutes:20,price:840,proteinGrams:400,ingredients:[{name:"ぶり切り身",qty:"4切れ",price:720},{name:"ししとう",qty:"1パック",price:120},{name:"しょうゆ",qty:"大さじ2",stock:!0},{name:"みりん",qty:"大さじ2",stock:!0},{name:"砂糖",qty:"大さじ1",stock:!0},{name:"薄力粉",qty:"大さじ1",stock:!0},{name:"サラダ油",qty:"小さじ2",stock:!0}],steps:["ぶりに薄力粉を薄くまぶす。","油でぶりの両面を焼き、ししとうも一緒に焼く。","余分な脂をふき、しょうゆ・みりん・砂糖を入れる。","とろみが出るまで煮からめる。"],note:"冬のぶりは脂がのって安め。ししとうは大人用に。"},{id:"m-sakana-meuniere",kind:"main",name:"鮭のムニエル",protein:"魚",genre:"洋",minutes:20,price:800,proteinGrams:400,ingredients:[{name:"生鮭",qty:"4切れ",price:600},{name:"じゃがいも",qty:"2個",price:100},{name:"ブロッコリー",qty:"1/2株",price:100},{name:"薄力粉",qty:"大さじ2",stock:!0},{name:"バター",qty:"15g",stock:!0},{name:"塩・こしょう",qty:"少々",stock:!0},{name:"サラダ油",qty:"小さじ2",stock:!0}],steps:["じゃがいもとブロッコリーを切り、レンジで加熱する。","鮭に塩・こしょうをして薄力粉をまぶす。","油とバターで鮭の両面をこんがり焼く。","野菜と一緒に盛る。"],note:"バターの香りで魚が苦手な子も食べやすい。ケチャップを添えても。"},{id:"m-sakana-tara-foil",kind:"main",name:"たらときのこのホイル焼き",protein:"魚",genre:"洋",minutes:25,price:840,proteinGrams:400,ingredients:[{name:"生たら",qty:"4切れ",price:560},{name:"玉ねぎ",qty:"1/2個",price:25},{name:"えのきたけ",qty:"1袋",price:100},{name:"ミニトマト",qty:"8個",price:160},{name:"バター",qty:"20g",stock:!0},{name:"しょうゆ",qty:"小さじ2",stock:!0},{name:"塩・こしょう",qty:"少々",stock:!0}],steps:["たらに塩・こしょうをする。","アルミホイルに玉ねぎの薄切り・たら・えのき・トマトをのせる。","バターをのせて包み、フライパンでふたをして12分蒸し焼き。","食べる前にしょうゆを少したらす。"],note:"包んで焼くだけで洗い物も少なめ。子どもの分は骨を確認して。"},{id:"m-sakana-salmon-cream",kind:"main",name:"鮭とほうれん草のクリーム煮",protein:"魚",genre:"洋",minutes:25,price:920,proteinGrams:400,ingr :["たらは3等分、白菜はざく切り、豆腐は角切りにする。","鍋にごま油を熱し白菜を炒め、水600mlと鶏がらの素を入れる。","たら・豆腐・えのきを入れて8分煮て、みそとしょうゆを溶く。","にらを加えてひと煮する。"],note:"辛くないみそ味。大人はキムチやコチュジャンを足してください。"},{id:"m-sakana-saba-kankoku",kind:"main",name:"さばの韓国風甘辛焼き",protein:"魚",genre:"韓",minutes:20,price:610,proteinGrams:400,ingredients:[{name:"さば切り身",qty:"4切れ",price:560},{name:"長ねぎ",qty:"1/2本",price:50},{name:"しょうゆ",qty:"大さじ2",stock:!0},{name:"砂糖",qty:"大さじ1",stock:!0},{name:"はちみつ",qty:"大さじ1",stock:!0},{name:"ごま油",qty:"大さじ1",stock:!0},{name:"にんにく（チューブ）",qty:"小さじ1/2",stock:!0},{name:"片栗粉",qty:"大さじ1",stock:!0},{name:"いりごま",qty:"小さじ1",stock:!0}],steps:["さばを半分に切り、片栗粉を薄くまぶす。","ごま油で皮目から焼き、返して火を通す。","しょうゆ・砂糖・はちみつ・にんにくを入れてからめる。","斜め切りのねぎを加えてさっと炒め、ごまをふる。"],note:"甘辛のたれで青魚のくせがやわらぎます。大人は一味を。"},{id:"m-sakana-curry-meuniere",kind:"main",name:"鮭のカレームニエル",protein:"魚",genre:"エスニック",minutes:20,price:800,proteinGrams:400,ingredients:[{name:"生鮭",qty:"4切れ",price:600},{name:"キャベツ",qty:"1/4個",price:80},{name:"ミニトマト",qty:"6個",price:120},{name:"薄力粉",qty:"大さじ2",stock:!0},{name:"カレー粉",qty:"小さじ1",stock:!0},{name:"塩",qty:"少々",stock:!0},{name:"サラダ油",qty:"大さじ1",stock:!0}],steps:["薄力粉とカレー粉を混ぜる。","鮭に塩をふり、カレー粉入りの粉をまぶす。","油で両面をこんがり焼く。","千切りキャベツとミニトマトを添える。"],note:"カレーの香りで魚の苦手な子もぱくぱく。粉は辛くない量で。"},{id:"m-sakana-kajiki-tandoori",kind:"main",name:"めかじきのタンドリー風",protein:"魚",genre:"エスニック",minutes:25,price:740,proteinGrams:400,ingredients:[{name:"めかじき",qty:"4切れ",price:600},{name:"プレーンヨーグルト",qty:"80g",price:40},{name:"ピーマン",qty:"2個",price:75},{name:"玉ねぎ",qty:"1/2個",price:25},{name:"カレー粉",qty:"小さじ1と1/2",stock:!0},{name:"ケチャップ",qty:"大さじ2",stock:!0},{name:"塩",qty:"少々",stock:!0},{name:"サラダ油",qty:"小さじ2",stock:!0}],steps:["ヨーグルト・カレー粉・ケチャップ・塩を混ぜる。","めかじきを一口大に切り、たれをからめて10分置く。","油で玉ねぎ・ピーマンと一緒に焼く。","ふたをして弱火で5分焼く。"],note:"骨のないめかじきで手軽に。前の晩に漬けておくとさらに楽です。"},{id:"m-tofu-hamburg",kind:"main",name:"豆腐ハンバーグ",protein:"卵・大豆",genre:"和",minutes:30,price:420,proteinGrams:350,ingredients:[{name:"木綿豆腐",qty:"1丁（350g）",price:100},{name:"鶏ひき肉",qty:"200g",price:220},{name:"玉ねぎ",qty:"1/2個",price:25},{name:"卵",qty:"1個",price:30},{name:"大根",qty:"1/4本",price:50},{name:"パン粉",qty:"1/2カップ",stock:!0},{name:"片栗粉",qty:"大さじ1",stock:!0},{name:"ポン酢",qty:"大さじ4",stock:!0},{name:"塩",qty:"少々",stock:!0},{name:"サラダ油",qty:"小さじ2",stock:!0}],steps:["豆腐はレンジで2分加熱し、水を切る。","豆腐・ひき肉・玉ねぎのみじん切り・卵・パン粉・片栗粉・塩をこねる。","小さめに丸め、両面を焼いてふたをして6分蒸し焼き。","大根おろしとポン酢をかける。"],note:"ふわふわでやわらかく、小さい子にもおすすめ。冷凍もできます。"},{id:"m-tofu-agedashi",kind:"main",name:"揚げ出し豆腐となす",protein:"卵・大豆",genre:"和",minutes:20,price:420,proteinGrams:700,ingredients:[{name:"木綿豆腐",qty:"2丁（700g）",price:200},{name:"なす",qty:"2本",price:140},{name:"大根",qty:"1/4本",price:50},{name:"青ねぎ",qty:"少々",price:30},{name:"片栗粉",qty:"大さじ4",stock:!0},{name:"しょうゆ",qty:"大さじ2",stock:!0},{name:"みりん",qty:"大さじ2",stock:!0},{name:"顆粒だし",qty:"小さじ1",stock:!0},{name:"サラダ油",qty:"大さじ4",stock:!0}],steps:["豆腐を8等分にして水気をふき、なすは乱切りにする。","豆腐に片栗粉をまぶし、なすと一緒に揚げ焼きにする。","水200ml・だし・しょうゆ・みりんを温めてつゆにする。","豆腐につゆをかけ、大根おろしとねぎをのせる。"],note:"外はカリッと中はとろり。つゆを吸わせると子どもも食べやすいです。"},{id:"m-tofu-steak",kind:"main",name:"豆腐ステーキのきのこあん",protein:"卵・大豆",genre:"和",minutes:20,price:420,proteinGrams:700,ingredients:[{name:"木綿豆腐",qty:"2丁（700g）",price:200},{name:"しめじ",qty:"1パック",price:120},{name:"えのきたけ",qty:"1袋",price:100},{name:"片栗粉",qty:"大さじ3",stock:!0},{name:"しょうゆ",qty:"大さじ2",stock:!0},{name:"みりん",qty:"大さじ2",stock:!0},{name:"顆粒だし",qty:"小さじ1",stock:!0},{name:"サラダ油",qty:"大さじ2",stock:!0}],steps:["豆腐を4等分に切り、水気をふいて片栗粉をまぶす。","油で両面をこんがり焼いて皿に盛る。","同じフライパンできのこを炒め、水150mlと調味料を入れる。","水溶き片栗粉でとろみをつけ、豆腐にかける。"],note:"きのこは細かく切ると、苦手な子も食べやすくなります。"},{id:"m-atsuage-nimono",kind:"main",name:"厚揚げと小松菜の煮びたし",protein:"卵・大豆",genre:"和",minutes:15,price:380,proteinGrams:400,ingredients:[{name:"厚揚げ",qty:"2枚（400g）",price:200},{name:"小松菜",qty:"1束",price:150},{name:"にんじん",qty:"1/2本",price:25},{name:"しょうゆ",qty:"大さじ2",stock:!0},{name:"みりん",qty:"大さじ2",stock:!0},{name:"顆粒だし",qty:"小さじ1",stock:!0}],steps:["厚揚げは熱湯をかけて油抜きし、一口大に切る。","小松菜は4cm、にんじんは短冊切りにする。","水250ml・だし・調味料を煮立て、厚揚げとにんじんを5分煮る。","小松菜を加えて2分煮る。"],note:"厚揚げは安くて食べごたえあり。冷めても味がしみておいしいです。"},{id:"m-tamago-kanitama",kind:"main",name:"かに玉",protein:"卵・大豆",genre:"中",minutes:15,price:350,proteinGrams:360,ingredients:[{name:"卵",qty:"6個",price:180},{name:"かに風味かまぼこ",qty:"1パック",price:120},{name:"長ねぎ",qty:"1/2本",price:50},{name:"しょうゆ",qty:"大さじ1",stock:!0},{name:"ケチャップ",qty:"大さじ2",stock:!0},{name:"酢",qty:"大さじ1",stock:!0},{name:"砂糖",qty:"大さじ1",stock:!0},{name:"片栗粉",qty:"小さじ2",stock:!0},{name:"ごま油",qty:"大さじ1",stock:!0}],steps:["卵を溶き、ほぐしたかにかまと斜め切りのねぎを混ぜる。","ごま油で卵液を大きく混ぜ、半熟で皿にのせる。","水150ml・しょうゆ・ケチャップ・酢・砂糖を煮立てる。","水溶き片栗粉でとろみをつけ、卵にかける。"],note:"ケチャップ入りの甘酢あんで子どもが喜ぶ味です。"},{id:"m-tamago-tomato",kind:"main",name:"トマトと卵の炒め物",protein:"卵・大豆",genre:"中",minutes:15,price:500,proteinGrams:360,ingredients:[{name:"卵",qty:"6個",price:180},{name:"トマト",qty:"3個",price:300},{name:"長ねぎ",qty:"1/4本",price:25},{name:"鶏がらスープの素",qty:"小さじ1",stock:!0},{name:"砂糖",qty:"小さじ1",stock:!0},{name:"塩",qty:"少々",stock:!0},{name:"ごま油",qty:"大さじ2",stock:!0}],steps:["トマトはくし切り、長ねぎは斜め切りにする。","卵に砂糖・塩を混ぜ、ごま油で半熟に炒めて取り出す。","トマトとねぎを炒め、鶏がらの素で味をつける。","卵を戻してさっと混ぜる。"],note:"卵はさっと取り出すとふわふわに。トマトの甘い時期に。"},{id:"m-atsuage-chingensai",kind:"main",name:"厚揚げとチンゲン菜のオイスター炒め",protein:"卵・大豆",genre:"中",minutes:15,price:370,proteinGrams:400,ingredients:[{name:"厚揚げ",qty:"2枚（400g）",price:200},{name:"チンゲン菜",qty:"2株",price:150},{name:"にんじん",qty:"1/3本",price:20},{name:"オイスターソース",qty:"大さじ2",stock:!0},{name:"しょうゆ",qty:"小さじ1",stock:!0},{name:"砂糖",qty:"小さじ1",stock:!0},{name:"片栗粉",qty:"小さじ1",stock:!0},{name:"ごま油",qty:"大さじ1",stock:!0}],steps:["厚揚げは一口大、チンゲン菜はざく切り、にんじんは短冊切り。","ごま油で厚揚げを焼き色がつくまで焼く。","野菜を加えて炒め、オイスターソースなどで味をつける。","水溶き片栗粉でとろみをつける。"],note:"お肉なしでも満足感。とろみで子どもも食べやすくなります。"},{id:"m-tamago-omurice",kind:"main",name:"オムライス",protein:"卵・大豆",genre:"洋",minutes:30,price:520,proteinGrams:360,ingredients:[{name:"卵",qty:"6個",price:180},{name:"鶏もも肉",qty:"200g",price:240},{name:"玉ねぎ",qty:"1/2個",price:25},{name:"ミックスベジタブル",qty:"100g",price:80},{name:"ごはん",qty:"4杯分",stock:!0},{name:"ケチャップ",qty:"大さじ6",stock:!0},{name:"牛乳",qty:"大さじ2",stock:!0},{name:"バター",qty:"10g",stock:!0},{name:"サラダ油",qty:"小さじ2",stock:!0}],steps:["鶏肉は小さく切り、玉ねぎはみじん切りにする。","油で鶏肉・玉ねぎ・ミックスベジタブルを炒め、ごはんを加える。","ケチャップで味をつけ、皿に盛る。","卵と牛乳を混ぜ、バターで半熟に焼いてのせる。"],note:"卵はスクランブル状にのせるだけでも十分。ケチャップで絵を描いても。"},{id:"m-tamago-spanish",kind:"main",name:"スパニッシュオムレツ",protein:"卵・大豆",genre:"洋",minutes:25,price:660,proteinGrams:420,ingredients:[{name:"卵",qty:"7個",price:210},{name:"じゃがいも",qty:"2個",price:100},{name:"玉ねぎ",qty:"1/2個",price:25},{name:"ほうれん草",qty:"1/2束",price:100},{name:"ベーコン",qty:"4枚",price:150},{name:"ピザ用チーズ",qty:"40g",price:80},{name:"牛乳",qty:"大さじ3",stock:!0},{name:"塩・こしょう",qty:"少々",stock:!0},{name:"オリーブ油",qty:"大さじ1",stock:!0}],steps:["じゃがいもは薄切りにしてレンジで3分加熱する。","玉ねぎ・ほうれん草・ベーコンを切って油で炒める。","卵・牛乳・チーズ・塩こしょうを混ぜ、具と合わせて流す。","ふたをして弱火で10分焼き、返して2分焼く。"],note:"切り分けると見た目も楽しい。ケチャップを添えると子どもに人気。"},{id:"m-tofu-gratin",kind:"main",name:"豆腐とほうれん草のグラタン",protein:"卵・大豆",genre:"洋",minutes:25,price:540,proteinGrams:350,ingredients:[{name:"絹豆腐",qty:"1丁（350g）",price:100},{name:"ほうれん草",qty:"1/2束",price:100},{name:"玉ねぎ",qty:"1/2個",price:25},{name:"ベーコン",qty:"4枚",price:150},{name:"ピザ用チーズ",qty:"80g",price:160},{name:"みそ",qty:"小さじ2",stock:!0},{name:"マヨネーズ",qty:"大さじ3",stock:!0}],steps:["ほうれん草は4cm、玉ねぎは薄切り、ベーコンは1cm幅に切る。","具をレンジで3分加熱し、水気を切って耐熱皿に入れる。","豆腐をつぶしてみそ・マヨと混ぜ、上にのせる。","チーズをのせ、トースターで10分焼く。"],note:"ホワイトソースなしで手軽に。豆腐がクリームのようになります。"},{id:"m-tofu-jeon",kind:"main",name:"豆腐とにらのチヂミ",protein:"卵・大豆",genre:"韓",minutes:20,price:330,proteinGrams:400,ingredients:[{name:"木綿豆腐",qty:"1丁（350g）",price:100},{name:"卵",qty:"1個",price:30},{name:"にら",qty:"1束",price:120},{name:"にんじん",qty:"1/3本",price:20},{name:"ちくわ",qty:"2本",price:60},{name:"片栗粉",qty:"大さじ4",stock:!0},{name:"薄力粉",qty:"大さじ4",stock:!0},{name:"鶏がらスープの素",qty:"小さじ1",stock:!0},{name:"ポン酢",qty:"適量",stock:!0},{name:"ごま油",qty:"大さじ2",stock:!0}],steps:["にらは3cm、にんじんは細切り、ちくわは輪切りにする。","豆腐をつぶし、卵・粉・鶏がらの素・具を混ぜる。","ごま油で薄く広げ、両面をカリッと焼く。","切り分けてポン酢をつける。"],note:"豆腐入りでもっちり。大人はポン酢にラー油を足してどうぞ。"},{id:"m-tofu-sundubu",kind:"main",name:"スンドゥブ風豆腐スープ",protein:"卵・大豆",genre:"韓",minutes:20,price:630,proteinGrams:700,ingredients:[{name:"絹豆腐",qty:"2丁（700g）",price:200},{name:"あさり水煮缶",qty:"1缶",price:200},{name:"卵",qty:"4個",price:120},{name:"にら",qty:"1/2束",price:60},{name:"白菜キムチ",qty:"50g",price:50},{name:"みそ",qty:"大さじ2",stock:!0},{name:"しょうゆ",qty:"小さじ2",stock:!0},{name:"鶏がらスープの素",qty:"小さじ2",stock:!0},{name:"ごま油",qty:"小さじ2",stock:!0}],steps:["鍋に水600ml・鶏がらの素・あさりを汁ごと入れて煮立てる。","豆腐をスプーンですくって入れ、みそ・しょうゆを溶く。","子どもの分を取り分け、残りにキムチを加える。","卵を割り入れ、にらを散らして2分煮る。"],note:"キムチは子どもの分を取り分けてから。あさりのだしでやさしい味。"},{id:"m-atsuage-curry",kind:"main",name:"厚揚げと野菜のカレー炒め",protein:"卵・大豆",genre:"エスニック",minutes:15,price:380,proteinGrams:400,ingredients:[{name:"厚揚げ",qty:"2枚（400g）",price:200},{name:"キャベツ",qty:"1/4個",price:80},{name:"ピーマン",qty:"2個",price:75},{name:"玉ねぎ",qty:"1/2個",price:25},{name:"カレー粉",qty:"小さじ2",stock:!0},{name:"しょうゆ",qty:"大さじ1",stock:!0},{name:"ケチャップ",qty:"大さじ1",stock:!0},{name:"サラダ油",qty:"大さじ1",stock:!0}],steps:["厚揚げは一口大、キャベツはざく切り、ピーマンと玉ねぎは細切り。","油で厚揚げを焼き、野菜を加えて炒める。","カレー粉・しょうゆ・ケチャップで味をつける。"],note:"カレーの香りで野菜もすすみます。辛くないので子どもも大丈夫。"},{id:"m-tamago-nasigoreng",kind:"main",name:"ナシゴレン風目玉焼きのせごはん",protein:"卵・大豆",genre:"エスニック",minutes:20,price:480,proteinGrams:360,ingredients:[{name:"卵",qty:"6個",price:180},{name:"むきえび",qty:"100g",price:200},{name:"玉ねぎ",qty:"1/2個",price:25},{name:"ピーマン",qty:"2個",price:75},{name:"ごはん",qty:"4杯分",stock:!0},{name:"ケチャップ",qty:"大さじ3",stock:!0},{name:"オイスターソース",qty:"大さじ1",stock:!0},{name:"ナンプラー",qty:"小さじ1",stock:!0},{name:"サラダ油",qty:"大さじ2",stock:!0}],steps:["玉ねぎ・ピーマンを粗みじんにする。","卵2個を炒り卵にし、えびと野菜を炒めて合わせる。","ごはんを加え、ケチャップ・オイスター・ナンプラーで炒める。","残りの卵で目玉焼きを作ってのせる。"],note:"ケチャップ多めで子ども向けに。大人はチリソースを後からどうぞ。"}],ah=[{id:"s-potato-salad",kind:"side",name:"ポテトサラダ",genre:"洋",minutes:20,price:220,ingredients:[{name:"じゃがいも",qty:"3個",price:150},{name:"きゅうり",qty:"1本",price:50},{name:"にんじん",qty:"1/3本",price:20},{name:"マヨネーズ",qty:"大さじ4",stock:!0},{name:"塩・こしょう",qty:"少々",stock:!0}],steps:["じゃがいもは一口大に切り、レンジで6分加熱してつぶす。","きゅうりは薄切りにして塩もみ、にんじんは薄いいちょう切り。","にんじんはレンジで1分加熱する。","全部を合わせ、マヨネーズと塩・こしょうであえる。"],note:"ハムやゆで卵を足すと、おかずにもなるボリュームに。"},{id:"s-coleslaw",kind:"side",name:"コールスロー",genre:"洋",minutes:10,price:220,ingredients:[{name:"キャベツ",qty:"1/4個",price:80},{name:"にんじん",qty:"1/3本",price:20},{name:"ホールコーン缶",qty:"1缶",price:120},{name:"マヨネーズ",qty:"大さじ3",stock:!0},{name:"酢",qty:"小さじ2",stock:!0},{name:"砂糖",qty:"小さじ1",stock:!0},{name:"塩",qty:"少々",stock:!0}],steps:["キャベツとにんじんを細切りにし、塩をふって5分置く。","水気をしぼり、コーンを加える。","マヨネーズ・酢・砂糖であえる。"],note:"コーンの甘さで子どもがよく食べます。"},{id:"s-harusame-salad",kind:"side",name:"春雨サラダ",genre:"中",minutes:15,price:250,ingredients:[{name:"春雨",qty:"40g",price:60},{name:"きゅうり",qty:"1本",price:50},{name:"にんじん",qty:"1/3本",price:20},{name:"ハム",qty:"4枚",price:120},{name:"しょうゆ",qty:"大さじ2",stock:!0},{name:"酢",qty:"大さじ2",stock:!0},{name:"砂糖",qty:"大さじ1",stock:!0},{name:"ごま油",qty:"小さじ2",stock:!0},{name:"いりごま",qty:"小さじ1",stock:!0}],steps:["春雨はゆでて戻し、食べやすく切る。","きゅうり・にんじん・ハムを細切りにする。","しょうゆ・酢・砂糖・ごま油を混ぜ、全部をあえる。","ごまをふる。"],note:"前の日に作っても味がなじんでおいしいです。"},{id:"s-daikon-tuna-salad",kind:"side",name:"大根とツナのサラダ",genre:"和",minutes:10,price:260,ingredients:[{name:"大根",qty:"1/4本",price:50},{name:"ツナ缶",qty:"1缶",price:150},{name:"貝割れ大根",qty:"1パック",price:60},{name:"マヨネーズ",qty:"大さじ2",stock:!0},{name:"しょうゆ",qty:"小さじ1",stock:!0}],steps:["大根は細切りにし、貝割れは根を落とす。","ツナの油を軽く切る。","全部をマヨネーズとしょうゆであえる。"],note:"ツナのうまみで大根の辛みがやわらぎます。"},{id:"s-broccoli-gomamayo",kind:"side",name:"ブロッコリーのごまマヨあえ",genre:"和",minutes:10,price:200,ingredients:[{name:"ブロッコリー",qty:"1株",price:200},{name:"すりごま",qty:"大さじ2",stock:!0},{name:"マヨネーズ",qty:"大さじ2",stock:!0},{name:"しょうゆ",qty:"小さじ1",stock:!0}],steps:["ブロッコリーを小房に分け、レンジで3分加熱する。","冷まして水気を切る。","すりごま・マヨネーズ・しょうゆであえる。"],note:"ごまマヨでブロッコリー嫌いの子も食べやすくなります。"},{id:"s-kabocha-salad",kind:"side",name:"かぼちゃサラダ",genre:"洋",minutes:15,price:210,ingredients:[{name:"かぼちゃ",qty:"1/4個",price:200},{name:"玉ねぎ",qty:"1/8個",price:10},{name:"マヨネーズ",qty:"大さじ3",stock:!0},{name:"塩・こしょう",qty:"少々",stock:!0}],steps:["かぼちゃを一口大に切り、レンジで5分加熱してつぶす。","玉ねぎを薄切りにし、水にさらして水気をしぼる。","マヨネーズと塩・こしょうであえる。"],note:"甘くておやつ感覚。レーズンを入れても子どもに人気です。"},{id:"s-macaroni-salad",kind:"side",name:"マカロニサラダ",genre:"洋",minutes:15,price:250,ingredients:[{name:"マカロニ",qty:"100g",price:80},{name:"きゅうり",qty:"1本",price:50},{name:"ハム",qty:"4枚",price:120},{name:"マヨネーズ",qty:"大さじ4",stock:!0},{name:"塩・こしょう",qty:"少々",stock:!0}],steps:["マカロニを表示時間どおりにゆで、水で冷やす。","きゅうりは薄切りにして塩もみ、ハムは短冊切りにする。","全部をマヨネーズと塩・こしょうであえる。"],note:"ゆで時間の短いマカロニを使うと時短になります。"},{id:"s-tataki-kyuri",kind:"side",name:"たたききゅうりの中華あえ",genre:"中",minutes:5,price:150,ingredients:[{name:"きゅうり",qty:"3本",price:150},{name:"しょうゆ",qty:"大さじ1",stock:!0},{name:"酢",qty:"小さじ2",stock:!0},{name:"砂糖",qty:"小さじ1",stock:!0},{name:"ごま油",qty:"小さじ2",stock:!0},{name:"いりごま",qty:"小さじ1",stock:!0}],steps:["きゅうりをめん棒でたたき、手で食べやすく割る。","しょうゆ・酢・砂糖・ごま油であえ、ごまをふる。"],note:"たたくのは子どものお手伝いにぴったり。大人はラー油を少し。"},{id:"s-choregi-salad",kind:"side",name:"チョレギサラダ",genre:"韓",minutes:5,price:210,ingredients:[{name:"レタス",qty:"1/2玉",price:100},{name:"きゅうり",qty:"1本",price:50},{name:"焼きのり",qty:"2枚",price:60},{name:"ごま油",qty:"大さじ1",stock:!0},{name:"しょうゆ",qty:"小さじ2",stock:!0},{name:"酢",qty:"小さじ1",stock:!0},{name:"塩",qty:"少々",stock:!0},{name:"いりごま",qty:"小さじ2",stock:!0}],steps:["レタスはちぎり、きゅうりは斜め薄切りにする。","ごま油・しょうゆ・酢・塩を混ぜる。","食べる直前に野菜とあえ、のりをちぎって散らす。"],note:"のりが好きな子は野菜もぺろり。あえるのは食べる直前に。"},{id:"s-horenso-ohitashi",kind:"side",name:"ほうれん草のおひたし",genre:"和",minutes:10,price:230,ingredients:[{name:"ほうれん草",qty:"1束",price:200},{name:"かつお節",qty:"1袋",price:30},{name:"しょうゆ",qty:"小さじ2",stock:!0},{name:"顆粒だし",qty:"少々",stock:!0}],steps:["ほうれん草をゆでて水にとり、水気をしぼる。","4cmに切り、しょうゆとだしを混ぜてあえる。","かつお節をのせる。"],note:"かつお節多めでうまみアップ。子どもは短めに切ると食べやすいです。"},{id:"s-ingen-gomaae",kind:"side",name:"いんげんのごまあえ",genre:"和",minutes:10,price:150,ingredients:[{name:"さやいんげん",qty:"1袋",price:150},{name:"すりごま",qty:"大さじ2",stock:!0},{name:"しょうゆ",qty:"小さじ2",stock:!0},{name:"砂糖",qty:"小さじ2",stock:!0}],steps:["いんげんを3cmに切り、レンジで2分半加熱する。","すりごま・しょうゆ・砂糖を混ぜ、いんげんをあえる。"],note:"甘めのごまあえは子どもに人気。ほうれん草でも同じように作れます。"},{id:"s-moyashi-namul",kind:"side",name:"もやしのナムル",genre:"韓",minutes:5,price:80,ingredients:[{name:"もやし",qty:"2袋",price:80},{name:"ごま油",qty:"大さじ1",stock:!0},{name:"鶏がらスープの素",qty:"小さじ1",stock:!0},{name:"塩",qty:"少々",stock:!0},{name:"いりごま",qty:"小さじ1",stock:!0}],steps:["もやしをレンジで3分加熱し、水気を切る。","ごま油・鶏がらの素・塩であえ、ごまをふる。"],note:"安くて5分で一品。熱いうちにあえると味がなじみます。"},{id:"s-komatsuna-namul",kind:"side",name:"小松菜とにんじんのナムル",genre:"韓",minutes:10,price:180,ingredients:[{name:"小松菜",qty:"1束",price:150},{name:"にんじん",qty:"1/2本",price:25},{name:"ごま油",qty:"大さじ1",stock:!0},{name:"しょうゆ",qty:"小さじ1",stock:!0},{name:"鶏がらスープの素",qty:"小さじ1/2",stock:!0},{name:"いりごま",qty:"小さじ1",stock:!0}],steps:["小松菜は4cm、にんじんは細切りにする。","一緒にレンジで3分加熱し、水気をしぼる。","ごま油・しょうゆ・鶏がらの素であえ、ごまをふる。"],note:"にんじんの甘みで小松菜のくせがやわらぎます。"},{id:"s-ninjin-shirishiri",kind:"side",name:"にんじんしりしり",genre:"和",minutes:10,price:240,ingredients:[{name:"にんじん",qty:"2本",price:100},{name:"卵",qty:"2個",price:60},{name:"ツナ缶",qty:"1/2缶",price:75},{name:"しょうゆ",qty:"小さじ2",stock:!0},{name:"砂糖",qty:"小さじ1",stock:!0},{name:"サラダ油",qty:"小さじ2",stock:!0}],steps:["にんじんをスライサーで細切りにする。","油でにんじんとツナを炒め、しんなりさせる。","しょうゆ・砂糖で味をつけ、溶き卵を回し入れて混ぜる。"],note:"ツナと卵でにんじん嫌いの子も食べやすい。お弁当にも。"},{id:"s-kinpira",kind:"side",name:"きんぴらごぼう",genre:"和",minutes:15,price:180,ingredients:[{name:"ごぼう",qty:"1本",price:150},{name:"にんじん",qty:"1/2本",price:25},{name:"しょうゆ",qty:"大さじ1と1/2",stock:!0},{name:"砂糖",qty:"大さじ1",stock:!0},{name:"みりん",qty:"大さじ1",stock:!0},{name:"ごま油",qty:"大さじ1",stock:!0},{name:"いりごま",qty:"小さじ1",stock:!0}],steps:["ごぼうとにんじんを細切りにし、ごぼうは水にさらす。","ごま油で炒め、しんなりしたら調味料を入れる。","汁気がなくなるまで炒め、ごまをふる。"],note:"細めに切ると子どもも噛みやすい。大人は一味を後からどうぞ。"},{id:"s-hijiki-ni",kind:"side",name:"ひじきの煮物",genre:"和",minutes:20,price:160,ingredients:[{name:"芽ひじき（乾燥）",qty:"15g",price:100},{name:"にんじん",qty:"1/3本",price:20},{name:"油揚げ",qty:"1枚",price:40},{name:"しょうゆ",qty:"大さじ1と1/2",stock:!0},{name:"砂糖",qty:"大さじ1",stock:!0},{name:"みりん",qty:"大さじ1",stock:!0},{name:"顆粒だし",qty:"小さじ1/2",stock:!0},{name:"サラダ油",qty:"小さじ1",stock:!0}],steps:["ひじきを水で10分戻し、水気を切る。","にんじん・油揚げを細切りにする。","油で炒め、水100mlと調味料を入れて汁気がなくなるまで煮る。"],note:"作りおきにぴったり。ごはんに混ぜても食べやすいです。"},{id:"s-kiriboshi-ni",kind:"side",name:"切り干し大根の煮物",genre:"和",minutes:20,price:160,ingredients:[{name:"切り干し大根",qty:"30g",price:100},{name:"にんじん",qty:"1/3本",price:20},{name:"油揚げ",qty:"1枚",price:40},{name:"しょうゆ",qty:"大さじ1と1/2",stock:!0},{name:"砂糖",qty:"大さじ1",stock:!0},{name:"みりん",qty:"大さじ1",stock:!0},{name:"顆粒だし",qty:"小さじ1/2",stock:!0}],steps:["切り干し大根はもみ洗いして10分戻し、食べやすく切る。","にんじん・油揚げを細切りにする。","水200ml・だし・調味料で全部を10分煮る。"],note:"甘めの味つけで子どもにも好評。冷蔵で3日ほど持ちます。"},{id:"s-tofu-wakame-misoshiru",kind:"side",name:"豆腐とわかめのみそ汁",genre:"和",minutes:10,price:80,ingredients:[{name:"絹豆腐",qty:"1/2丁",price:50},{name:"長ねぎ",qty:"1/4本",price:25},{name:"乾燥わかめ",qty:"小さじ2",stock:!0},{name:"顆粒だし",qty:"小さじ2",stock:!0},{name:"みそ",qty:"大さじ3",stock:!0}],steps:["鍋に水700mlとだしを入れて煮立てる。","さいの目の豆腐とわかめを入れて2分煮る。","火を弱めてみそを溶き、小口切りのねぎを散らす。"],note:"みそは火を止める直前に溶くと香りがよくなります。"},{id:"s-tonjiru",kind:"side",name:"具だくさん豚汁",genre:"和",minutes:25,price:270,ingredients:[{name:"豚こま切れ肉",qty:"100g",price:140},{name:"大根",qty:"1/6本",price:35},{name:"にんじん",qty:"1/3本",price:20},{name:"じゃがいも",qty:"1個",price:50},{name:"長ねぎ",qty:"1/4本",price:25},{name:"顆粒だし",qty:"小さじ2",stock:!0},{name:"みそ",qty:"大さじ3",stock:!0},{name:"ごま油",qty:"小さじ1",stock:!0}],steps:["大根・にんじんはいちょう切り、じゃがいもは一口大に切る。","ごま油で豚肉と野菜を炒め、水800mlとだしを入れる。","野菜がやわらかくなるまで10分煮る。","みそを溶き、小口切りのねぎを散らす。"],note:"具が多いので、主菜が軽い日にもおすすめです。"},{id:"s-kakitama-soup",kind:"side",name:"ふわふわかき玉スープ",genre:"中",minutes:10,price:140,ingredients:[{name:"卵",qty:"2個",price:60},{name:"長ねぎ",qty:"1/4本",price:25},{name:"ホールコーン缶",qty:"1/2缶",price:60},{name:"鶏がらスープの素",qty:"小さじ2",stock:!0},{name:"しょうゆ",qty:"小さじ1",stock:!0},{name:"片栗粉",qty:"小さじ2",stock:!0},{name:"塩",qty:"少々",stock:!0}],steps:["鍋に水700mlと鶏がらの素・コーンを入れて煮立てる。","しょうゆ・塩で味をつけ、水溶き片栗粉でとろみをつける。","溶き卵を細く回し入れ、ねぎを散らす。"],note:"とろみをつけてから卵を入れると、ふわふわになります。"},{id:"s-corn-soup",kind:"side",name:"コーンスープ",genre:"洋",minutes:15,price:240,ingredients:[{name:"クリームコーン缶",qty:"1缶",price:150},{name:"牛乳",qty:"300ml",price:75
